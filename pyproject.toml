[project]
name = "stideo"
version = "0.1.0"
description = "Stitch video clips by whole-clip similarity, boundary continuity or natural filename order."
requires-python = ">=3.15,<3.16"
dependencies = [
    "filelock>=3.18,<5",
    "numpy>=2.5,<3",
    "opencv-python-headless>=5.1,<6",
]

[project.scripts]
stideo = "stideo.cli:entrypoint"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py315"
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
# Chinese punctuation is intentional in messages and documentation.
allowed-confusables = ["，", "（", "）", "：", "×", "–"]
ignore = [
    "COM812", "D203", "D213",  # Conflicts with the formatter or the selected docstring convention.
    "D101", "D102", "D103", "D107", "D400", "D415",  # Internal helpers and Chinese prose.
    "CPY001",  # File-level copyright banners are optional.
    "EM101", "EM102", "TRY003",  # Keep actionable CLI errors at the failure site.
    "PLR2004",  # Media formats, feature extraction, and test oracles use numeric constants.
]

[tool.ruff.lint.per-file-ignores]
# User-facing progress is part of the command line interface.
"src/stideo/{cli,content,export,models,ordering,timing}.py" = ["T201"]
# These modules launch known FFmpeg/ffprobe programs via argument vectors on PATH.
"src/stideo/{commands,content,export}.py" = ["S603", "S607"]
"tests/**.py" = ["S101", "S603", "S607"]

[tool.ruff.lint.pylint]
max-args = 7  # Media layout and reporting APIs have independent named options.
