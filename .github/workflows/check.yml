name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
      - run: uv run --locked --only-group dev ruff check .
      - run: uv run --locked --only-group dev ruff format --check .
      - run: uv build

  test:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/stitch-videos/models
          key: dinov2-${{ hashFiles('src/stideo/models.py') }}
      - name: Prepare the default and both offline test models
        run: |
          uv run --locked stideo --fetch-model
          uv run --locked stideo --fetch-model --model dinov2-small-int8
          uv run --locked stideo --fetch-model --model mobilevit-xxs
      - run: uv run --locked pytest -q
        env:
          STIDEO_OFFLINE: "1"
      - name: Benchmark the base revision
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/stideo-base" "$BASE_SHA"
          uv sync --locked --no-dev --project "$RUNNER_TEMP/stideo-base"
          uv run --locked python -m tests.benchmark --executable "$RUNNER_TEMP/stideo-base/.venv/bin/stideo" --output "$RUNNER_TEMP/baseline.json"
      - name: Measure stitching performance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          compare=()
          if [[ -f "$RUNNER_TEMP/baseline.json" ]]; then
            compare=(--baseline "$RUNNER_TEMP/baseline.json")
          fi
          uv run --locked python -m tests.benchmark --output "$RUNNER_TEMP/benchmark.json" "${compare[@]}"
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-video-benchmark
          path: |
            ${{ runner.temp }}/benchmark.json
            ${{ runner.temp }}/baseline.json
          if-no-files-found: ignore
